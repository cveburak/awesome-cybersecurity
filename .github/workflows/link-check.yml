name: Link Check

on:
  push:
    branches: [main]
    paths: ["**.md", ".github/workflows/link-check.yml"]
  pull_request:
    paths: ["**.md"]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 403/429: bot-protected sites (e.g. Cloudflare) must not cause false alarms.
          # Retries + longer timeout absorb slow or rate-limited hosts.
          args: >-
            --no-progress
            --cache
            --max-cache-age 1d
            --max-concurrency 8
            --max-retries 3
            --retry-wait-time 10
            --timeout 30
            --max-redirects 10
            --accept 200,201,202,204,206,403,429
            "./**/*.md"
          output: ./lychee/out.md
          fail: false

      - name: Fail on broken links (push / PR)
        if: github.event_name != 'schedule' && steps.lychee.outputs.exit_code != 0
        run: |
          cat ./lychee/out.md
          exit 1

      - name: Open an issue with the report (weekly run)
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "Link check report"
          content-filepath: ./lychee/out.md
          labels: maintenance, automated
