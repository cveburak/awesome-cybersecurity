name: "➕ Suggest a resource / Kaynak öner"
description: Suggest a new cybersecurity resource for the list
title: "[Add] "
labels: ["new-resource"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! Please read [CONTRIBUTING.md](https://github.com/cveburak/awesome-cybersecurity/blob/main/CONTRIBUTING.md) first.
        Katkın için teşekkürler! Önce [CONTRIBUTING.tr.md](https://github.com/cveburak/awesome-cybersecurity/blob/main/CONTRIBUTING.tr.md) dosyasına göz at.
  - type: input
    id: name
    attributes:
      label: Resource name / Kaynak adı
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official URL / Resmi bağlantı
      description: No referral or affiliate links.
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Section / Bölüm
      options:
        - Fundamentals
        - Training and Labs
        - Web Security
        - API Security
        - Mobile Security
        - Penetration Testing and Red Teaming
        - Blue Team, SOC and DFIR
        - Cryptography
        - Reverse Engineering, Malware Analysis and Exploit Development
        - Cloud and Container Security
        - AI and LLM Security
        - CTF Platforms and Competitions
        - Bug Bounty Hunting
        - Standards and Frameworks
        - Certifications
        - YouTube Channels
        - Books
        - Podcasts, News and Newsletters
        - Vulnerable Apps and Labs
        - Security Tools
        - Turkish Resources
    validations:
      required: true
  - type: dropdown
    id: price
    attributes:
      label: Price / Fiyat
      options:
        - 🟢 Free / Ücretsiz
        - 🟡 Freemium (free tier + paid) / Freemium
        - 🔴 Paid / Ücretli
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Side / Role / Yön / Rol
      options:
        - ⚔️ Offensive / Ofansif
        - 🛡️ Defensive / Defansif
        - ⚔️🛡️ Mixed / Karma
        - 🏛️ GRC
        - 🧩 Shared / Ortak
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Level / Seviye
      options:
        - Beginner / Başlangıç
        - Intermediate / Orta
        - Advanced / İleri
        - All levels / Tüm seviyeler
  - type: textarea
    id: note
    attributes:
      label: One-sentence description / Tek cümlelik açıklama
      description: Neutral wording, no marketing language.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation / Onay
      options:
        - label: It is legal, ethical and actively maintained (no pirated or leaked content). / Yasal, etik ve güncel; korsan veya sızdırılmış içerik değil.
          required: true
        - label: I checked that it is not already in the list. / Listede zaten olmadığını kontrol ettim.
          required: true
